# Reference manifest for the YOLO26n COCO-pretrained model used by the
# vision_pipeline integration tests.  Per §3.3 of
# `phase_1_universal_ep_and_manifest.md`.
#
# NOTE: this ONNX file is the NMS-in-graph end-to-end variant (shape
# [1, 300, 6]), decoded by the `post_nms` postprocessor.  No external
# NMS, sigmoid, or letterbox inversion needed — all handled in-graph.

schema_version: 1

name:        yolo26n-coco
purpose:     detection
trained_on:  COCO 2017
notes:       Bring-up / smoke test — post-NMS end-to-end model.

input:
  layout:           NCHW
  channel_order:    RGB
  expected_shape:   [1, 3, 640, 640]
  dtype:            float32
  normalization:
    scale:          0.00392156862745
    mean:           [0.0, 0.0, 0.0]
    std:            [1.0, 1.0, 1.0]
  preprocessing:
    letterbox:      true
    pad_value:      [114, 114, 114]
    pad_to:         model_input

output:
  head:             post_nms
  format:           xyxy_conf_cls
  expected_shape:   [1, 300, 6]
  num_classes:      80
  nms_in_graph:     true
  thresholds:
    score:          0.25

runtime_hints:
  preferred_ep:     DirectML
  precision:        fp16
  cache_compiled:   true

classes:
  - {id:   0, name: person,         roc_label: Person}
  - {id:   1, name: bicycle,        roc_label: Unknown}
  - {id:   2, name: car,            roc_label: Unknown}
