# =============================================================================
# coco-yolov8-baseline.yaml
#
# Reference manifest §3.3 of phase_1_universal_ep_and_manifest.md.
#
# Target model (auto-selected from C:/Users/heave/Desktop/onnx_collection/):
#   Red Dead Redemption II (REDM) by Padre.onnx
#     (12,823,525 bytes — alphabetically-first of the two 1×84×8400 COCO
#      models in the user's 113-file collection; the other is "Trench
#      Warfare by oSheep.onnx" at 12,823,528 B — same architecture, picked
#      by alphabetical deterministic rule per Phase 6 part A worker spec.)
#
# Output shape `[1, 84, 8400]` = 4 bbox + 80 COCO class probabilities
# (already sigmoid-activated by the Ultralytics export).  Detection head =
# `yolov8_detect` (not `yolo26_detect` — see postprocessor source for the
# critical "scores are already sigmoid'd" difference).
#
# Class mapping rationale: the user's webcam demo wants to see THEMSELVES
# detected — class 0 `person` is therefore the only class that maps to a
# tracked roc::kinematics::Label (`Person`).  The five COCO classes that
# share an analogue with the ROC humanoid hierarchy (backpack, handbag,
# tie, cell_phone) are mapped to ACCESSORY labels so they show up as
# child tracks under the parent Person if the constraint solver finds
# them spatially co-located.  Everything else stays `Unknown` and the
# yolov8 postprocessor's `lookup_label` returns `Label::Unknown`, which
# the tracker's lifecycle drops at spawn (per §4.6).
# =============================================================================

schema_version: 1

name:        coco-yolov8-baseline
purpose:     detection
trained_on:  COCO 2017 (80 classes, Ultralytics YOLOv8 export)
notes: >
  Phase 6 part A demo manifest. Mapped to the `Red Dead Redemption II
  (REDM) by Padre.onnx` file in the user's onnx_collection. Mappings only
  the four humanoid-relevant COCO classes to roc::kinematics::Label
  values; the remaining 76 stay Unknown and the tracker filters them.

input:
  layout:           NCHW
  channel_order:    RGB
  expected_shape:   [1, 3, 640, 640]
  dtype:            float32
  normalization:
    scale:          0.00392156862745
    mean:           [0.0, 0.0, 0.0]
    std:            [1.0, 1.0, 1.0]
  preprocessing:
    letterbox:      true
    pad_value:      [114, 114, 114]
    pad_to:         model_input

output:
  head:             yolov8_detect
  format:           cxcywh_sigmoid
  expected_shape:   [1, 84, 8400]
  num_classes:      80
  nms_in_graph:     false
  thresholds:
    score:          0.30
    iou:            0.45

runtime_hints:
  preferred_ep:     DirectML
  precision:        fp16
  cache_compiled:   true

classes:
  - {id: 0,  name: person,         roc_label: Person}
  - {id: 1,  name: bicycle,        roc_label: Unknown}
