# Single-class humanoid detector — stylized / non-photorealistic visual domain.
# YOLOv8m architecture, 11.7 MB. Trained on rendered humanoid figures with
# saturated colors and non-realistic proportions.
# Useful research applications: animation pipeline QA, cartoon-style content
# moderation, robustness baseline for distribution-shift studies.

schema_version: 1

name:        humanoid-detector-stylized
purpose:     detection
trained_on:  Mixed rendered-humanoid visual corpus (saturated colors, non-photoreal)
notes:       Provides distribution-shift contrast against the arid/tactical
             domain models — useful for studying how detector confidence
             varies across visual styles.

input:
  layout:           NCHW
  channel_order:    RGB
  expected_shape:   [1, 3, 640, 640]
  dtype:            float32
  normalization:
    scale:          0.00392156862745
    mean:           [0.0, 0.0, 0.0]
    std:            [1.0, 1.0, 1.0]
  preprocessing:
    letterbox:      true
    pad_value:      [114, 114, 114]
    pad_to:         model_input

output:
  head:             yolo26_detect
  format:           cxcywh_logits
  expected_shape:   [1, 5, 8400]
  num_classes:      1
  nms_in_graph:     false
  thresholds:
    score:          0.25

runtime_hints:
  preferred_ep:     DirectML
  precision:        fp16
  cache_compiled:   true

classes:
  - {id:   0, name: person          , roc_label: Person}
