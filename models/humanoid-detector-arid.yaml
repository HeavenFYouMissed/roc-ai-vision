# Single-class humanoid detector — arid biome visual domain.
# YOLOv8m architecture, exported with raw [1, 5, 8400] head (no in-graph NMS).
# Useful research applications: counter-UAS perimeter monitoring, wildlife
# surveying in open terrain, outdoor surveillance dataset annotation.

schema_version: 1

name:        humanoid-detector-arid
purpose:     detection
trained_on:  Mixed open-terrain visual corpus (military uniforms + arid backgrounds)
notes:       42.6 MB. Strong cross-domain generalization to real-world outdoor
             surveillance footage. Verified end-to-end on the project's drone
             tracking demonstration (humanoid target at ~400 m, 1080p source).

input:
  layout:           NCHW
  channel_order:    RGB
  expected_shape:   [1, 3, 640, 640]
  dtype:            float32
  normalization:
    scale:          0.00392156862745
    mean:           [0.0, 0.0, 0.0]
    std:            [1.0, 1.0, 1.0]
  preprocessing:
    letterbox:      true
    pad_value:      [114, 114, 114]
    pad_to:         model_input

output:
  head:             yolo26_detect
  format:           cxcywh_logits
  expected_shape:   [1, 5, 8400]
  num_classes:      1
  nms_in_graph:     false
  thresholds:
    score:          0.25

runtime_hints:
  preferred_ep:     DirectML
  precision:        fp16
  cache_compiled:   true

classes:
  - {id:   0, name: person          , roc_label: Person}
